<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Federated Learning Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="FL.css">
</head>
<body>



<div class="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  FEDERATED LEARNING WORKFLOW  ·  Pure Canvas Animation
//  Phases:  BROADCAST → TRAINING → AGGREGATE → UPDATING  (loop)
// ══════════════════════════════════════════════════════════════════

// ── Preload device images ─────────────────────────────────────────
const IMG_RPI    = new Image(); IMG_RPI.src    = 'images/rapi5.png';
const IMG_JETSON = new Image(); IMG_JETSON.src = 'images/nano.png';
const IMG_SERVER = new Image(); IMG_SERVER.src = 'images/server.png';

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ─── Logical canvas dimensions ────────────────────────────────────
const W = 1200, H = 590;
const DPR = window.devicePixelRatio || 1;

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const cw = wrap.clientWidth  - 20;
  const ch = wrap.clientHeight - 10;
  const aspect = W / H;
  let cssW = cw, cssH = cw / aspect;
  if (cssH > ch) { cssH = ch; cssW = ch * aspect; }
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ─── Color palette ────────────────────────────────────────────────
const C = {
  rpi:    { base:'#10b981', hi:'#6ee7b7', dark:'#064e3b', light:'#d1fae5' },
  jetson: { base:'#f59e0b', hi:'#fde68a', dark:'#78350f', light:'#fef3c7' },
  server: { base:'#7c3aed', hi:'#c4b5fd', dark:'#2e1065', light:'#ede9fe' },
  bcast:  '#a855f7',
  agg:    '#0ea5e9',
  textDk: '#1e1b4b',
  textMd: '#374151',
  textLt: '#9ca3af',
};

const CYL = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4'];

// ─── Node definitions ─────────────────────────────────────────────
const SR = 56;
const NR = 42;
const SERVER = { x: W/2, y: H * 0.435 };

const CLIENTS = [
// Left — Raspberry Pi 5  (slow: 0.46 progress/s)
{ id:0, x:200,     y:130,     side:'L', type:'rpi',    name:'Client 1', speed:0.46 },
{ id:1, x:200,     y:300,     side:'L', type:'rpi',    name:'Client 3', speed:0.46 },
{ id:2, x:200,     y:470,     side:'L', type:'rpi',    name:'Client 5', speed:0.46 },
// Right — NVIDIA Jetson Orin Nano  (fast: 0.88 progress/s)
{ id:3, x:W-200,   y:130,     side:'R', type:'jetson', name:'Client 2', speed:0.88 },
{ id:4, x:W-200,   y:300,     side:'R', type:'jetson', name:'Client 4', speed:0.88 },
{ id:5, x:W-200,   y:470,     side:'R', type:'jetson', name:'Client 6', speed:0.88 },
];

// ─── Phase state machine ──────────────────────────────────────────
const PHASES = ['BROADCAST','TRAINING','AGGREGATE','UPDATING'];
const PDUR   = [2400, 5000, 2400, 1200];
let phaseIdx = 0;
let phaseT0  = null;
let roundNum = 1;
let lastTS   = null;

let particles = [];
const trainFill     = new Array(6).fill(0);
const sentAggregate = new Array(6).fill(false); // track per-client aggregate send
let dashOff = 0;

// ─── Math helpers ─────────────────────────────────────────────────
function qbez(p0, cp, p1, t) {
  const u = 1 - t;
  return { x: u*u*p0.x + 2*u*t*cp.x + t*t*p1.x,
           y: u*u*p0.y + 2*u*t*cp.y + t*t*p1.y };
}

function ctrlPt(a, b, bow = 0.13) {
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  const dx = b.x-a.x, dy = b.y-a.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: mx + (-dy/len)*len*bow, y: my + (dx/len)*len*bow };
}

// ─── Particle factory ─────────────────────────────────────────────
function spawnBroadcast() {
  particles = [];
  CLIENTS.forEach(c => particles.push({
    from:SERVER, to:c, cp:ctrlPt(SERVER,c),
    progress:0, speed:c.speed,
    color:C.bcast, glow:'#e879f9', arrived:false, id:c.id,
  }));
}

// ─── Drawing primitives ───────────────────────────────────────────
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w,y, x+w,y+h, r);
  ctx.arcTo(x+w,y+h, x,y+h, r);
  ctx.arcTo(x,y+h, x,y, r);
  ctx.arcTo(x,y, x+w,y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); }

function drawBg() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(148,163,184,0.11)';
  const gs = 38;
  for (let x = gs/2; x < W; x += gs)
    for (let y = gs/2; y < H; y += gs) {
      ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
    }
  const cg = ctx.createRadialGradient(W/2,H/2,40, W/2,H/2,420);
  cg.addColorStop(0,'rgba(124,58,237,0.07)');
  cg.addColorStop(1,'rgba(124,58,237,0)');
  ctx.fillStyle = cg; ctx.fillRect(0,0,W,H);

  // Title
  ctx.fillStyle = '#4c1d95';
  ctx.font = 'bold 28px Poppins, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Federated Learning Workflow', W/2, 38);

  ctx.fillStyle = '#7c6fa6';
  ctx.font = '600 13px Nunito, system-ui';
  ctx.fillText('Privacy-preserving distributed training across heterogeneous edge devices', W/2, 60);
}
// ─── Connection lines — always visible ───────────────────────────
function drawLines(phase) {
  const isBcast = phase === 'BROADCAST';
  CLIENTS.forEach(c => {
    const cp = ctrlPt(SERVER, c);
    ctx.save();
    ctx.strokeStyle = isBcast ? 'rgba(168,85,247,0.55)' : 'rgba(14,165,233,0.55)';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = isBcast ? -dashOff : dashOff;
    ctx.shadowColor = isBcast ? C.bcast : C.agg;
    ctx.shadowBlur  = 5;
    ctx.beginPath();
    ctx.moveTo(SERVER.x, SERVER.y);
    ctx.quadraticCurveTo(cp.x, cp.y, c.x, c.y);
    ctx.stroke();
    ctx.restore();
  });
}

// ─── Server node ──────────────────────────────────────────────────
function drawServer(ts, phase) {
  const { x, y } = SERVER;
  const updating = phase === 'UPDATING';

  const LW = SR * 5.5;
  const LH = SR * 4;
  const LX = x - LW/2;
  const LY = y - LH/2;
  const SW = LW * 0.68;
  const SH = LH * 0.56;
  const SX = x - SW/2;
  const SY = LY + LH*0.02;

  // Compute bx/by early so orbit block can access them
  const pText = {BROADCAST:'📡 Broadcasting',TRAINING:'⏳ Waiting',AGGREGATE:'⏳ Waiting',UPDATING:'🔄 Aggregating'}[phase];
  const pBg   = {BROADCAST:'#7c3aed',TRAINING:'#6b7280',AGGREGATE:'#6b7280',UPDATING:'#d97706'}[phase];
  ctx.font = 'bold 11px Nunito,system-ui';
  ctx.textAlign = 'center';
  const tw = ctx.measureText(pText).width + 22;
  const bx = x - tw/2;
  const by = SY + SH * 0.37;

  // Pulse glow during UPDATING
  if (updating) {
    const pf = (Math.sin(ts*0.005)+1)/2;
    ctx.save();
    ctx.shadowColor = '#7c3aed';
    ctx.shadowBlur  = 40 + pf*20;
    ctx.globalAlpha = 0.18 + pf*0.12;
    ctx.drawImage(IMG_SERVER, LX, LY, LW, LH);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Laptop image
  ctx.drawImage(IMG_SERVER, LX, LY, LW, LH);

  // Phase bubble on screen
  ctx.save();
  rrect(bx, by, tw, 24, 12);
  ctx.fillStyle = pBg; ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 11px Nunito,system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(pText, x, by + 16);
  ctx.restore();

  // 6 orbiting model icons during UPDATING
  if (updating) {
    for (let i = 0; i < 6; i++) {
      const angle = (ts * 0.002) + (i / 6) * Math.PI * 2;
      const ix = x + Math.cos(angle) * 32;
      const iy = (by + 50) + Math.sin(angle) * 18;
      const iCol = ['#10b981','#f59e0b','#3b82f6','#ec4899','#a855f7','#06b6d4'][i];

      ctx.save();
      ctx.translate(ix, iy);
      // Connections
      ctx.strokeStyle = iCol; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.moveTo(-6,-3); ctx.lineTo(0,-5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6,-3); ctx.lineTo(0, 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6, 3); ctx.lineTo(0,-5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6, 3); ctx.lineTo(0, 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-5);  ctx.lineTo(6, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 5);  ctx.lineTo(6, 0); ctx.stroke();
      ctx.globalAlpha = 1;
      // Nodes
      [[-6,-3],[-6,3],[0,-5],[0,5],[6,0]].forEach(([nx,ny]) => {
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(nx,ny,2,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = iCol; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(nx,ny,2,0,Math.PI*2); ctx.stroke();
      });
      ctx.restore();

    }
  }

  // Round badge
  ctx.fillStyle = '#e11d48';
  circle(SX + SW - 35, SY + 35, 15); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 10px Nunito,system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('R' + roundNum, SX + SW - 35, SY + 37);

  // Server label
  ctx.fillStyle = C.textLt;
  ctx.font = 'bold 15px Nunito,system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Server', x, LY + LH - 30);
}

// ─── Client node ──────────────────────────────────────────────────
function drawClient(c, ts, phase, pp) {
  const { x, y, type, name, id, side } = c;
  const clientColors = ['#60a5fa','#a78bfa','#f472b6','#fb923c','#34d399','#22d3ee'];
  const cc = clientColors[id];
  const col = C[type];
  const training = phase === 'TRAINING';
  const pscale = training ? 1 + Math.sin(ts*0.005 + id*1.4)*0.043 : 1;

  // Client name above image
  ctx.fillStyle = C.textDk;
  ctx.font = 'bold 11.5px Nunito,system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(name, x, y - NR - 10);

  // Device image
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(pscale, pscale);
  const img = (type==='rpi') ? IMG_RPI : IMG_JETSON;
  ctx.drawImage(img, -NR, -NR, NR*2, NR*2);
  ctx.restore();

  // Spinning gears during TRAINING
  if (training) {
    const spin = ts*0.0035;
    ctx.save(); ctx.translate(x+NR*.65, y-NR*.62); ctx.rotate(spin);
    drawGear(0,0,10,7,cc); ctx.restore();
    ctx.save(); ctx.translate(x-NR*.66, y-NR*.56); ctx.rotate(-spin*1.6);
    drawGear(0,0,7,5,cc+'bb'); ctx.restore();
  }

  // Training progress bar
  if (training) {
    const spd = type==='rpi' ? 1.0 : 1.6;
    trainFill[id] = Math.min(pp * spd, 1);
    const bw=NR*2.7, bh=8, bx=x-bw/2, by=y+NR+11;
    ctx.fillStyle=cc+'33'; rrect(bx,by,bw,bh,4); ctx.fill();
    if (trainFill[id]>0.01) {
      ctx.fillStyle=cc;
      rrect(bx,by,bw*trainFill[id],bh,4); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.28)';
      rrect(bx,by, Math.min(bw*trainFill[id], bw*.55), bh/2, 2); ctx.fill();
    }
    ctx.fillStyle=cc; ctx.font='bold 9px Nunito,system-ui'; ctx.textAlign='center';
    ctx.fillText(Math.round(trainFill[id]*100)+'% trained', x, by+bh+14);
  } else {
    trainFill[id] = 0;
  }

  // Local data cylinder
  const cxOff = side==='L' ? -NR-38 : NR+38;
  drawCylinder(x+cxOff, y, id);
}

function drawGear(cx, cy, r, teeth, color) {
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle=color+'cc'; ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=0.8;
  const ir=r*.64;
  ctx.beginPath();
  for(let i=0;i<teeth;i++){
    const a0=(i/teeth)*Math.PI*2,     a1=(i/teeth+.4/teeth)*Math.PI*2,
          a2=(i/teeth+.6/teeth)*Math.PI*2, a3=((i+1)/teeth)*Math.PI*2;
    ctx.lineTo(Math.cos(a0)*ir, Math.sin(a0)*ir);
    ctx.lineTo(Math.cos(a1)*r,  Math.sin(a1)*r);
    ctx.lineTo(Math.cos(a2)*r,  Math.sin(a2)*r);
    ctx.lineTo(Math.cos(a3)*ir, Math.sin(a3)*ir);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.28)'; circle(0,0,r*.32); ctx.fill();
  ctx.restore();
}

function drawCylinder(x, y, id) {
  const colors = [
    '#60a5fa', // blue
    '#a78bfa', // purple
    '#f472b6', // pink
    '#fb923c', // orange
    '#34d399', // green
    '#22d3ee', // cyan
  ];
  const color = colors[id % colors.length];
  const light = color + '33';
  const w = 26, h = 38, ey = 8;
  ctx.save();

  // Body
  ctx.fillStyle = light;
  ctx.fillRect(x - w/2, y - h/2 + ey/2, w, h - ey);

  // Left & right border lines
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - w/2, y - h/2 + ey/2); ctx.lineTo(x - w/2, y + h/2 - ey/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w/2, y - h/2 + ey/2); ctx.lineTo(x + w/2, y + h/2 - ey/2); ctx.stroke();

  // Middle divider lines (like database layers)
  ctx.strokeStyle = color + '88';
  ctx.lineWidth = 1;
  const mid1 = y - h/2 + ey/2 + (h - ey) * 0.33;
  const mid2 = y - h/2 + ey/2 + (h - ey) * 0.66;
  ctx.beginPath(); ctx.moveTo(x - w/2, mid1); ctx.lineTo(x + w/2, mid1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - w/2, mid2); ctx.lineTo(x + w/2, mid2); ctx.stroke();

  // Bottom ellipse
  ctx.fillStyle = color + 'aa';
  ctx.beginPath(); ctx.ellipse(x, y + h/2 - ey/2, w/2, ey/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(x, y + h/2 - ey/2, w/2, ey/2, 0, 0, Math.PI*2); ctx.stroke();

  // Top ellipse
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(x, y - h/2 + ey/2, w/2, ey/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(x, y - h/2 + ey/2, w/2, ey/2, 0, 0, Math.PI*2); ctx.stroke();

  // Top sheen
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.ellipse(x, y - h/2 + ey/2, w/2 * 0.6, ey/2 * 0.5, 0, 0, Math.PI*2); ctx.fill();

  // Label
  ctx.fillStyle = '#374151';
  ctx.font = '8px Nunito,system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Local', x, y + h/2 + 12);
  ctx.fillText('Data',  x, y + h/2 + 22);

  ctx.restore();
}

// ─── Particle ─────────────────────────────────────────────────────
function drawParticle(p) {
  if (p.arrived) return;
  const pos = qbez(p.from, p.cp, p.to, p.progress);
  for(let i=7;i>=1;i--) {
    const tr = Math.max(0, p.progress - i*.015);
    const tp = qbez(p.from, p.cp, p.to, tr);
    const alpha = Math.round((1-i/8)*.22*255).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(tp.x,tp.y, 4+(7-i)*.5, 0,Math.PI*2);
    ctx.fillStyle=p.color+alpha; ctx.fill();
  }
  const halo=ctx.createRadialGradient(pos.x,pos.y,1, pos.x,pos.y,20);
  halo.addColorStop(0, p.color+'88'); halo.addColorStop(1, p.color+'00');
  ctx.fillStyle=halo; circle(pos.x,pos.y,20); ctx.fill();
  ctx.save();
  ctx.shadowColor=p.glow; ctx.shadowBlur=16;
  ctx.fillStyle='white'; circle(pos.x,pos.y,8.5); ctx.fill();
  ctx.restore();
  ctx.fillStyle=p.color; circle(pos.x,pos.y,5.5); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 7px Nunito,system-ui'; ctx.textAlign='center';
  ctx.fillText('W', pos.x, pos.y+2.5);
}


function drawLegend() {
  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.strokeStyle='rgba(19,181,253,0.3)'; ctx.lineWidth=1;
  rrect(100,12,158,44,13);; ctx.fill(); ctx.stroke();
  ctx.drawImage(IMG_RPI, 120-12, 30-12, 35, 35);
  ctx.fillStyle=C.textMd; ctx.font='bold 12px Nunito,system-ui'; ctx.textAlign='left';
  ctx.fillText('Raspberry Pi 5',148,30);
  ctx.fillStyle=C.textLt; ctx.font='10px Nunito,system-ui';
  ctx.fillText('CPU Processor',148,47);

  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.strokeStyle='rgba(19,181,253,0.3)'; ctx.lineWidth=1;
  rrect(W-250,12,158,44,13); ctx.fill(); ctx.stroke();
  ctx.drawImage(IMG_JETSON, W-230-12, 30-12, 35, 35);
  ctx.fillStyle=C.textMd; ctx.font='bold 12px Nunito,system-ui'; ctx.textAlign='left';
  ctx.fillText('Jetson Orin Nano',W-200,30);
  ctx.fillStyle=C.textLt; ctx.font='10px Nunito,system-ui';
  ctx.fillText('GPU Processor',W-200,47);
}

function drawPhaseStrip(phase, pp) {
  const strip=[
    {label:'📡 Broadcast', c:'#7c3aed'},
    {label:'⚙ Local Training',  c:'#059669'},
    {label:'⏳ Waiting',   c:'#0284c7'},
    {label:'🔄 Updating',  c:'#d97706'},
  ];
  const bw=440, bh=22, bx=(W-bw)/2, by=H-110;
  ctx.fillStyle='rgba(255,255,255,0.76)';
  ctx.strokeStyle='rgba(196,181,253,0.38)'; ctx.lineWidth=1;
  rrect(bx,by,bw,bh,11); ctx.fill(); ctx.stroke();
  const iw=bw/4;
  strip.forEach((s,i)=>{
    const active=PHASES[i]===phase;
    const ix=bx+iw*i, iy=by;
    if(active){
      ctx.fillStyle=s.c+'22'; rrect(ix+2,iy+2,iw-4,bh-4,9); ctx.fill();
      ctx.fillStyle=s.c+'44'; rrect(ix+2,iy+2,(iw-4)*pp,bh-4,9); ctx.fill();
    }
    ctx.fillStyle=active?s.c:'#9ca3af';
    ctx.font=(active?'bold ':'')+'9px Nunito,system-ui'; ctx.textAlign='center';
    ctx.fillText(s.label, ix+iw/2, by+15);
  });
}

// ─── Main render loop ─────────────────────────────────────────────
function render(ts) {
  if (lastTS === null) {
    lastTS = ts; phaseT0 = ts;
    spawnBroadcast();
  }

  const dt = ts - lastTS; lastTS = ts;
  const elapsed = ts - phaseT0;
  const pp = Math.min(elapsed / PDUR[phaseIdx], 1);
  const phase = PHASES[phaseIdx];

  // Phase transition
  if (pp >= 1) {
    phaseIdx = (phaseIdx+1) % 4;
    phaseT0 = ts;
    const nPhase = PHASES[phaseIdx];
    if (nPhase === 'BROADCAST') {
      roundNum++;
      spawnBroadcast();
      sentAggregate.fill(false); // reset for next round
    } else if (nPhase === 'UPDATING') {
      particles = []; // clear aggregate particles
    }
  }

  // Update particles
  const dtS = dt / 1000;
  particles.forEach(p => {
    if (!p.arrived) {
      p.progress = Math.min(p.progress + p.speed * dtS, 1);
      if (p.progress >= 1) p.arrived = true;
    }
  });

  dashOff = (dashOff + dtS * 55) % 400;

  // Draw
  // Title
  drawBg();
  drawLines(phase);
  CLIENTS.forEach(c => drawClient(c, ts, phase, pp));

  // ── Spawn aggregate particle AFTER drawClient updates trainFill ──
  // Nano sends as soon as 100%, RPi sends when it reaches 100%
  if (phase === 'TRAINING') {
    CLIENTS.forEach(c => {
      if (trainFill[c.id] >= 1 && !sentAggregate[c.id]) {
        sentAggregate[c.id] = true;
        const aggColors = ['#3b82f6','#a78bfa','#f472b6','#fb923c','#34d399','#22d3ee'];
        particles.push({
          from: c, to: SERVER, cp: ctrlPt(SERVER, c),
          progress: 0, speed: c.speed,
          color: aggColors[c.id], glow: aggColors[c.id], arrived: false, id: c.id,
        });
      }
    });
  }

  drawServer(ts, phase);
  particles.forEach(p => drawParticle(p));
  drawPhaseStrip(phase, pp);
  drawLegend();

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
